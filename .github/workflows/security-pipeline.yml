name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: portfolio-site-secure
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_REF: portfolio-site-secure:${{ github.sha }}

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: devsecops/requirements-dev.txt

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r devsecops/requirements-dev.txt

      - name: Install Docker Scout CLI
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o /tmp/install-scout.sh
          sh /tmp/install-scout.sh
          docker scout version

      - name: Authenticate Docker Hub for Scout
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Detect secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Build Docker image
        run: |
          docker build \
            --file devsecops-portfolio/Dockerfile \
            --tag "$IMAGE_REF" \
            .

      - name: Scan image and write reports
        run: |
          bash devsecops/security-scan.sh "$IMAGE_REF"

      - name: Generate Excel report
        if: always()
        run: |
          python devsecops/generate-report.py \
            --input devsecops/reports/vulnerability-report.sarif.json \
            --output devsecops/reports/vulnerability-report.xlsx \
            --recommendations devsecops/reports/base-image-recommendations.txt \
            --image "$IMAGE_REF"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: devsecops/reports/
          if-no-files-found: warn

      - name: Enforce critical vulnerability policy
        if: always()
        run: |
          test -f devsecops/reports/critical-exit-code
          test "$(cat devsecops/reports/critical-exit-code)" = "0"

      - name: Notify Telegram on pipeline failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIPELINE_STATUS: failure
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python devsecops/notify-telegram.py
          else
            echo "Telegram secrets are not configured; skipping notification."
          fi
